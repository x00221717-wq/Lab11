name: HTML CI/CD

on:
  push:
    branches:
      - "**.html"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML file exists
        run: |
          test -f index.html

  cd-deploy:
    needs: ci-test

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
